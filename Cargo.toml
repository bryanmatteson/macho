[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/bryanmatteson/macho"
repository = "https://github.com/bryanmatteson/macho.git"
version = "0.2.0"

[workspace.dependencies]
macho-core = { path = "crates/macho-core", version = "0.2.0" }
macho-insn = { path = "crates/macho-insn", version = "0.2.0" }
macho-dyld = { path = "crates/macho-dyld", version = "0.2.0" }
macho-symbols = { path = "crates/macho-symbols", version = "0.2.0" }
macho-codesign = { path = "crates/macho-codesign", version = "0.2.0" }
macho-dwarf = { path = "crates/macho-dwarf", version = "0.2.0" }
macho-objc = { path = "crates/macho-objc", version = "0.2.0" }
macho-swift = { path = "crates/macho-swift", version = "0.2.0" }
macho-cpp = { path = "crates/macho-cpp", version = "0.2.0" }
macho-analysis = { path = "crates/macho-analysis", version = "0.2.0" }
macho-mutate = { path = "crates/macho-mutate", version = "0.2.0" }
macho-dyld-cache = { path = "crates/macho-dyld-cache", version = "0.2.0" }
macho-header-infer = { path = "crates/macho-header-infer", version = "0.2.0" }
macho-workflow = { path = "crates/macho-workflow", version = "0.2.0" }
macho = { path = "crates/macho", version = "0.2.0", default-features = false }
macho-cli = { path = "crates/macho-cli", version = "0.2.0" }
macho-test-support = { path = "crates/macho-test-support", version = "0.2.0" }

zerocopy = { version = "0.8", features = ["derive"] }
thiserror = "2"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpp_demangle = "0.5.1"
gimli = { version = "0.33.1", features = ["read"] }
rustc-demangle = "0.1"
sha2 = "0.10"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "op_code_info", "instr_info", "intel"] }
bad64 = "0.12"
criterion = "0.7"
cargo_metadata = "0.22"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
tempfile = "3"
trybuild = "1"
trycmd = "0.15"
