[workspace]
    exclude  = ["fuzz"]
    members  = [
        "crates/macho",
        "crates/macho-test-support",
        "crates/xtask",
    ]
    resolver = "2"

[workspace.package]
    edition      = "2024"
    homepage     = "https://github.com/bryanmatteson/macho"
    license      = "MIT"
    readme       = "README.md"
    repository   = "https://github.com/bryanmatteson/macho.git"
    rust-version = "1.85"
    version      = "1.0.0"

[workspace.dependencies]
    apple-codesign = { version = "0.29.0", default-features = false }
    macho          = { path = "crates/macho", version = "1", default-features = false }
    anyhow           = "1"
    base64           = "0.23.1"
    bitflags         = "2"
    bytes            = "1"
    cargo_metadata   = "0.23.1"
    clap             = { version = "4", features = ["derive"] }
    cpp_demangle     = "0.5.1"
    criterion        = "0.8.2"
    gimli            = { version = "0.34.0", features = ["read"] }
    laidout          = "0.3"
    memmap2          = "0.9"
    rustc-demangle   = "0.1"
    serde            = { version = "1", features = ["derive"] }
    serde_json       = "1"
    sha2             = "0.11.0"
    signature        = "2"
    swift-demangler  = "0.1.1"
    syn              = { version = "2", features = ["full", "visit"] }
    tempfile         = "3"
    termosaic        = { version = "=0.3.0", default-features = false }
    thiserror        = "2"
    tree-sitter      = "0.26.11"
    tree-sitter-c    = "0.24.2"
    tree-sitter-cpp  = "0.23.4"
    tree-sitter-objc = "3.0.2"
    trybuild         = "1"
    trycmd           = "1.2.1"
    walkdir          = "2"
    x509-certificate = "0.24.0"
    zerocopy         = { version = "0.8", features = ["derive"] }
    zeroize          = "1"
