[package]
name = "macho-cpp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "C++ RTTI, vtable, and ABI inference for Mach-O images"
readme = "README.md"

[features]
default = ["abi", "fixups", "itanium-rtti"]
abi = ["fixups", "dep:macho-insn"]
fixups = ["dep:macho-dyld"]
itanium-rtti = ["fixups"]

[dependencies]
macho-core.workspace = true
macho-demangle.workspace = true
macho-insn = { workspace = true, optional = true }
macho-dyld = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
macho-test-support.workspace = true
serde_json.workspace = true
