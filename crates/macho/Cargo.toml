[package]
name = "macho"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Feature-gated Mach-O library façade"
keywords = ["macho", "binary", "dylib", "executable", "macos"]
categories = ["development-tools::debugging", "development-tools::profiling"]

[features]
default = ["analysis"]
metadata = [
  "dep:macho-symbols", "dep:macho-dyld", "dep:macho-codesign",
  "dep:macho-dwarf", "dep:macho-objc", "dep:macho-swift", "dep:macho-cpp",
  "dep:macho-evidence", "dep:macho-header-syntax",
]
analysis = ["metadata", "dep:macho-insn", "dep:macho-analysis"]
mutation = [
  "dep:macho-insn", "dep:macho-dyld", "dep:macho-codesign",
  "dep:macho-mutate", "dep:macho-patch",
]
workflow = ["analysis", "mutation", "dep:macho-workflow"]
dyld-cache = ["dep:macho-dyld-cache"]
header-infer = ["analysis", "dep:macho-header-infer"]
full = ["analysis", "mutation", "workflow", "dyld-cache", "header-infer"]

[dependencies]
macho-core.workspace = true
macho-insn = { workspace = true, optional = true }
macho-symbols = { workspace = true, optional = true }
macho-dyld = { workspace = true, optional = true }
macho-codesign = { workspace = true, optional = true }
macho-dwarf = { workspace = true, optional = true }
macho-objc = { workspace = true, optional = true }
macho-swift = { workspace = true, optional = true }
macho-cpp = { workspace = true, optional = true, features = ["abi", "fixups", "itanium-rtti"] }
macho-evidence = { workspace = true, optional = true }
macho-analysis = { workspace = true, optional = true }
macho-mutate = { workspace = true, optional = true }
macho-patch = { workspace = true, optional = true }
macho-workflow = { workspace = true, optional = true }
macho-dyld-cache = { workspace = true, optional = true }
macho-header-infer = { workspace = true, optional = true }
macho-header-syntax = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
macho-test-support = { path = "../macho-test-support" }

[[bench]]
name = "architecture"
harness = false
