[package]
name = "macho-swift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Swift metadata indexing for Mach-O images"
readme = "README.md"

[features]
default = []
strict-rtti = ["dep:macho-dyld"]

[dependencies]
macho-core.workspace = true
macho-demangle.workspace = true
macho-dyld = { workspace = true, optional = true }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
macho-test-support = { path = "../macho-test-support" }
