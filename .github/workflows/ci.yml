name: CI

on:
  push:
  pull_request:

env:
  CARGO_BUILD_JOBS: 2

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask verify
      - name: Verify exact release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo xtask release --check --require-tag
      - name: Real macOS signing oracle
        if: runner.os == 'macOS'
        run: >-
          cargo test -p macho-cli --test patch_signing_tests
          macos_codesign_oracle -- --ignored --exact --nocapture
      - name: Retain benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ matrix.os }}
          path: target/criterion
          if-no-files-found: ignore

  fuzz:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask verify-fuzz
      - name: Bounded fuzz smoke
        shell: bash
        run: |
          for target in container load_commands dyld codesign insn mutation cache_fileset; do
            cargo fuzz run "$target" -- -max_total_time=10
          done
